[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pageindex"
version = "0.1.0"
description = "Vectorless, reasoning-based RAG: hierarchical tree index for long documents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Vectify AI" },
]
keywords = ["rag", "pdf", "llm", "pageindex", "vectorless"]
dependencies = [
    "litellm==1.84.0",
    "pymupdf==1.26.4",
    "PyPDF2==3.0.1",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.2",
    "mcp>=1.27,<2",
    "httpx>=0.27",
]

[project.optional-dependencies]
docling = [
    "docling",
]
flash = [
    "pypdfium2",
    "sortedcontainers",
    "regex",
]
agents = [
    "openai-agents",
]
# Common local/dev combo: Docling + Flash + agent demo
all = [
    "pageindex[docling,flash,agents]",
]

[project.scripts]
pageindex-mcp = "pageindex.mcp.__main__:main"

[project.urls]
Homepage = "https://pageindex.ai"
Documentation = "https://docs.pageindex.ai"
Repository = "https://github.com/VectifyAI/PageIndex"

[tool.setuptools.packages.find]
include = ["pageindex*"]

[tool.setuptools.package-data]
pageindex = [
    "config.yaml",
    "flash/data/*.json",
]
