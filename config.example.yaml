# Example PageIndex config — mount over /config/config.yaml in Compose
# Models without a provider prefix use the OpenAI SDK directly.
# For other providers, use "provider/model" format (e.g. "anthropic/claude-sonnet-4-6").
model: "gpt-4o-2024-11-20"
# model: "anthropic/claude-sonnet-4-6"
summary_model: "gpt-4o-2024-11-20"
retrieve_model: "gpt-4o-2024-11-20"
toc_check_page_num: 20
max_page_num_each_node: 10
max_token_num_each_node: 20000
if_add_node_id: "yes"
if_add_node_summary: "yes"
if_add_doc_description: "no"
if_add_node_text: "no"
